plugins {
    // Lets Gradle download the JDK the toolchain asks for (gradle.properties javaVersion) when no
    // matching JDK is installed, e.g. on Arch or Homebrew where the default JDK is newer than 25.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'pcgen'
include 'PCGen-base', 'PCGen-Formula'
